# Einzige Wahrheit für die Profilseite (readme.md), den Katalog aller Projekte (projekte.md) und das Portfolio.
# Nach jeder Änderung: python3 werkzeug/profil.py (Profil und Katalog) und python3 werkzeug/portfolio.py (PDF)
#
# Profil:   technik       Beschriftung des Steckfelds im Rack
#           katalog       Ziel der Taste "Alle Projekte"
#           unterstuetzen Ziel der Taste "Unterstützen"
# Gruppe:   titel, text (Zeile im Katalog), begleittext (Absatz im Portfolio), projekt = [...]
# Projekt:  name   Beschriftung der Kachel (lange Namen brechen an Leerzeichen oder Bindestrich um)
#           info   Kurzbeschreibung, erscheint beim Darüberfahren
#           icon   Datei unter icons/ (freigestellte Icons bevorzugen)
#           repo   Repo im Konto; Ziel des Links, wenn kein link angegeben ist
#           link   optional: anderes Ziel, etwa Store-Eintrag oder Seite zum Ausprobieren
#           ausblenden  true: nicht im Katalog (projekte.md); bleibt in den Daten und im Portfolio
#           Nur für die Projekte im Rack der Profilseite:
#           top     Platz im Rack (1, 2, ...); Projekte ohne top erscheinen nur im Katalog
#           akzent  Leuchtfarbe des Projekts, passend zum Icon
#           technik Schlagworte auf dem Einschub
#           fokus   true für das eine Projekt im großen Fokus-Einschub, dazu punkte (drei Stärken) und bild
# Liste:    titel, eintrag = [{ repo, info }], erscheint aufklappbar unter den Kacheln

[profil]
technik = ["Python", "FastAPI", "Svelte 5", "TypeScript", "Swift", "Docker", "Raspberry Pi", "MLX"]
katalog = "https://github.com/HalloWelt42/HalloWelt42/blob/master/projekte.md"
