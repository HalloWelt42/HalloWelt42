# Entwurf: die Top-Projekte für die neue Profilseite.
# Bei Umsetzung wandert die Auswahl als "top = true" (und "fokus = true") nach projekte.toml.
#
# name    Beschriftung        info   Kurzbeschreibung (höchstens 68 Zeichen, zwei Zeilen)
# repo    Repo im Konto       link   optional anderes Ziel
# icon    Pfad ab Repo-Wurzel akzent Leuchtfarbe des Projekts (aus dem Icon)
# technik Schlagworte         punkte nur beim Fokus-Projekt: drei Stärken
# bild    nur beim Fokus-Projekt: Bildschirmfoto

